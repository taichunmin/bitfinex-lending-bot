name: 'test'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    if: github.repository_owner == 'taichunmin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: lts/*
      - name: install & lint & test
        run: |
          set -ex;
          yarn --frozen-lockfile
          yarn lint
          yarn test
